name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: pip install -e ".[onnx,dev]"
      - name: Lint with ruff
        run: ruff check .
      - name: Run unit tests
        run: pytest -v
